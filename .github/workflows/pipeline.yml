name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  code:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"

  tuple-matrix:
    needs: [code]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_targets: ${{ steps.targets.outputs.build_targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Render build targets
        id: targets
        run: printf 'build_targets=%s\n' "$(python scripts/tuple_matrix.py ci-targets)" >> "$GITHUB_OUTPUT"

  docker:
    needs: [tuple-matrix]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/torchbase
      target_platforms: linux/amd64
      build_targets: ${{ needs.tuple-matrix.outputs.build_targets }}
      scan_severity: high
      scan_fail_build: false
      dockerhub_private: false
      sync_description: true
      cache_mode: max
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  badges:
    needs: [code]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
